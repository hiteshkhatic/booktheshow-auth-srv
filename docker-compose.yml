version: '3.8'

services: 
  postgres-db:
    image: postgres:16-alpine
    container_name: auth-pg-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: booktheshow_dev_db
    ports: 
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data: